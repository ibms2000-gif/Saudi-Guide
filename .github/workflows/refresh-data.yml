name: Refresh OpenStreetMap data

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-place-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch current place data
        run: npm run data
      - name: Validate fetched data
        run: npm run validate:data
      - name: Run tests
        run: npm test
      - name: Verify static build
        run: npm run build
      - name: Open data refresh pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-place-data
          delete-branch: true
          commit-message: "Refresh OpenStreetMap place data"
          title: "Refresh Saudi Guide place data"
          body: |
            Automated weekly refresh of place records from OpenStreetMap via Overpass API.
            The pull request is created only after data validation, unit tests, and static build pass.
          add-paths: |
            data/places/*.json
